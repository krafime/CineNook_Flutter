    <!-- Muat konfigurasi secara dinamis dengan obfuscation -->
    <script>
      // Fungsi untuk men-decode config yang dienkripsi dengan penanganan error
      function decodeConfig(encoded) {
        // Cek apakah masih dalam bentuk placeholder
        if (encoded === "__FIREBASE_CONFIG_PLACEHOLDER__" || encoded.startsWith("__")) {
          console.warn("Running in development mode with local config");
          // Dalam mode development, muat konfigurasi dari file lokal
          return {
            apiKey: "AIzaSyAtHCA3pJy7XIliLwKlvwmYqS7fZ90L9UY",
            authDomain: "cinenook-flutter.firebaseapp.com",
            projectId: "cinenook-flutter",
            storageBucket: "cinenook-flutter.firebasestorage.app",
            messagingSenderId: "215921381040",
            appId: "1:215921381040:web:e46f695af5e2e7fbfbf575",
            measurementId: "G-LXV5GBNDME"
          };
        }
        
        try {
          return JSON.parse(atob(encoded));
        } catch (e) {
          console.error("Failed to decode configuration:", e);
          // Fallback ke konfigurasi default untuk development
          return {
            apiKey: "AIzaSyAtHCA3pJy7XIliLwKlvwmYqS7fZ90L9UY",
            authDomain: "cinenook-flutter.firebaseapp.com",
            projectId: "cinenook-flutter",
            storageBucket: "cinenook-flutter.firebasestorage.app",
            messagingSenderId: "215921381040",
            appId: "1:215921381040:web:e46f695af5e2e7fbfbf575",
            measurementId: "G-LXV5GBNDME"
          };
        }
      }

      // Deteksi mode development
      const isDevelopment = location.hostname === "localhost" || 
                            location.hostname === "127.0.0.1";
      
      // Definisikan placeholder yang akan diganti saat build
      window.firebaseConfig = decodeConfig("__FIREBASE_CONFIG_PLACEHOLDER__");
      window.recaptchaKey = "__RECAPTCHA_KEY_PLACEHOLDER__" === "__RECAPTCHA_KEY_PLACEHOLDER__" 
                          ? "6LdbZPoqAAAAAIfEN2FS13cY8QAYAvVhV3nWAF4W"  // fallback untuk development
                          : "__RECAPTCHA_KEY_PLACEHOLDER__";
      
      // Log mode aplikasi
      console.log(`Running in ${isDevelopment ? "development" : "production"} mode`);
    </script>

    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-analytics.js";
      import { getAuth } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
      import {
        initializeAppCheck,
        ReCaptchaV3Provider,
      } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app-check.js";

      // Initialize Firebase - Dengan config yang dimuat secara dinamis
      const app = initializeApp(window.firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);

      // Force HTTPS in production
      if (location.hostname !== "localhost" && location.protocol !== "https:") {
        location.href =
          "https:" +
          window.location.href.substring(window.location.protocol.length);
      }

      // Simpan reCAPTCHA key dalam variabel environment
      const recaptchaSiteKey =
        window.recaptchaKey || "6LdbZPoqAAAAAIfEN2FS13cY8QAYAvVhV3nWAF4W";

      // Tambahkan App Check untuk keamanan tambahan
      const appCheck = initializeAppCheck(app, {
        provider: new ReCaptchaV3Provider(recaptchaSiteKey),
        isTokenAutoRefreshEnabled: true,
      });
    </script>
